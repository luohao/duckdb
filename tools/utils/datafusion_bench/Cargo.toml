[package]
name = "datafusion_bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "datafusion_bench"
path = "src/main.rs"

[dependencies]
datafusion = "52.1"
datafusion-functions = "52.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
